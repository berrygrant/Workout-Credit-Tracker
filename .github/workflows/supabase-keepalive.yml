name: Supabase keep-alive

on:
  schedule:
    - cron: "17 10 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Touch Supabase keep-alive row
        env:
          SUPABASE_URL: "https://nqdjafklbgzwlkwrpjnt.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_R9C-cCjGLUJX90MJFyR3Cw_zCY4JqtM"
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/touch_app_keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{}'
